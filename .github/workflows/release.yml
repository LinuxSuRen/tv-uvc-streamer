name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Rename artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk "tv-uvc-streamer-${GITHUB_REF_NAME}-universal.apk"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tv-uvc-streamer-*-universal.apk
          generate_release_notes: true
