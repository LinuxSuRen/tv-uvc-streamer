name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 手动安装 Gradle（不用 gradle/actions/setup-gradle：其注入的
      # 依赖图/结果捕获 init 脚本在 Gradle 9 上出现"Resolved plugin
      # 后立刻 not found"的假失败，实测日志可见）
      - name: Set up Gradle
        run: |
          curl -sSfL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-9.2.1/bin" >> "$GITHUB_PATH"

      # ubuntu runner 自带 Android SDK（含 cmdline-tools），只需接受 license，
      # NDK/CMake 由 AGP 按需自动安装（setup-android 的默认包 tools 已从
      # SDK 仓库下架，会导致该 action 失败）
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Debug network to google maven
        run: |
          curl -sI -m 10 "https://dl.google.com/android/maven2/com/android/application/com.android.application.gradle.plugin/8.13.2/com.android.application.gradle.plugin-8.13.2.pom" | head -1
          java -version 2>&1 | head -1

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Rename artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk "tv-uvc-streamer-${GITHUB_REF_NAME}-universal.apk"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tv-uvc-streamer-*-universal.apk
          generate_release_notes: true
